<div class="sidebar-navigation">
  <h3>All Entries</h3>
  <!-- The style attribute below removes the invisible bullet container padding -->
  <ul style="list-style: none; padding-left: 0; margin-left: 0;">
    {% for post in site.posts %}
      <li class="{% if page.url == post.url %}active-post{% endif %}" style="margin-bottom: 10px;">
        <a href="{{ post.url }}">&gt;&gt; {{ post.title }}</a>
      </li>
    {% endfor %}
  </ul>
</div>
