---
layout: default
---
<style>
  /* 1. Reset any global container overrides so the header stays perfectly centered naturally */
  .wrapper, .container, section, body > div {
    max-width: 1024px !important;
    margin: 0 auto !important;
    padding-left: 20px !important;
    padding-right: 20px !important;
  }

  /* 2. Style the layout columns for the post content body */
  .blog-container {
    display: flex;
    gap: 30px;
    margin-top: 30px;
    text-align: left;
  }
</style>

<div class="blog-container">
  
  <!-- Left Side: Navigation Sidebar -->
  <aside style="flex: 1; max-width: 220px; border-right: 1px solid #333; padding-right: 20px;">
    {% include sidebar-nav.html %}
  </aside>

  <!-- Right Side: The actual post text -->
  <main style="flex: 3; min-width: 0;">
    <h1 style="margin-top: 0;">{{ page.title }}</h1>
    <p class="meta">by {{ page.author }} on {{ page.date | date_to_string }}</p>
    <hr style="border-color: #333;">
    <div class="post-content">
      {{ content }}
    </div>
  </main>

</div>
