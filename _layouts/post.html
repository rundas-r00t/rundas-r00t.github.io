---
layout: default
---
<style>
  /* 1. Force the page body to stretch wide and left with clean breathing room */
  .wrapper, .container, section, body > div {
    max-width: 100% !important;
    margin-left: 0 !important;
    margin-right: 0 !important;
    padding-left: 30px !important; /* This adds a perfect 30px safety padding on the far left */
    padding-right: 30px !important;
  }

  /* 2. Target the top header block specifically and keep it perfectly centered */
  header, .site-header, #header, body > header {
    text-align: center !important;
    margin-left: auto !important;
    margin-right: auto !important;
    max-width: 1024px !important; /* Keeps the header bounded so it doesn't stretch to the edges */
    padding-left: 0 !important;
  }
</style>


<div class="blog-container" style="display: flex; gap: 30px;">
  
  <!-- Left Side: Navigation Sidebar -->
  <aside style="flex: 1; max-width: 250px; border-right: 1px solid #333; padding-right: 20px;">
    {% include sidebar-nav.html %}
  </aside>

  <!-- Right Side: The actual post text -->
  <main style="flex: 3; min-width: 0;">
    <h1>{{ page.title }}</h1>
    <p class="meta">by {{ page.author }} on {{ page.date | date_to_string }}</p>
    <hr>
    <div class="post-content">
      {{ content }}
    </div>
  </main>

</div>
