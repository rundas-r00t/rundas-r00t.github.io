---
layout: default
---
<style>
  /* 1. Force the container to fill widescreen views cleanly */
  .wrapper, .container, section, body > div {
    max-width: 100% !important;
    margin-left: 0 !important;
    margin-right: 0 !important;
    padding-left: 30px !important;
    padding-right: 30px !important;
  }

  /* 2. Strip standard centering rules from the header so we can align it manually */
  header, .site-header, #header, body > header {
    max-width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    text-align: left !important;
  }
</style>

<script>
  // This script injects an alignment box into your theme's header block dynamically
  document.addEventListener("DOMContentLoaded", function() {
    var headerContent = document.querySelector('header, .site-header, #header, body > header');
    if (headerContent) {
      // Wrap existing header contents in a flex system to match our body columns
      var innerHTML = headerContent.innerHTML;
      headerContent.innerHTML = `
        <div style="display: flex; gap: 30px; width: 100%;">
          <!-- Invisible structural spacer box matching your 250px sidebar exactly -->
          <div style="flex: 1; max-width: 250px; padding-right: 20px;"></div>
          <!-- Centered content section -->
          <div style="flex: 3; min-width: 0; text-align: center; margin-right: 250px;">
            ${innerHTML}
          </div>
        </div>
      `;
    }
  });
</script>

<div class="blog-container" style="display: flex; gap: 30px; margin-top: 20px;">
  
  <!-- Left Side: Navigation Sidebar -->
  <aside style="flex: 1; max-width: 250px; border-right: 1px solid #333; padding-right: 20px;">
    {% include sidebar-nav.html %}
  </aside>

  <!-- Right Side: The actual post text -->
  <main style="flex: 3; min-width: 0;">
    <h1>{{ page.title }}</h1>
    <p class="meta">by {{ page.author }} on {{ page.date | date_to_string }}</p>
    <hr>
    <div class="post-content">
      {{ content }}
    </div>
  </main>

</div>
